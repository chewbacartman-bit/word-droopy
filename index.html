<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Bookley's Word Drop - v.0.0.033</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Quicksand:wght@600;700&display=swap');

        :root {
            --bg-paper: #f4efe6;
            --ink: #1c1917;
            --mustard: #eab308;
            --teal: #0d9488;
            --blue: #0284c7;
            --silver: #64748b;
            --gold: #d97706;
            --tile-green: #22c55e;
            --tile-gold: #f59e0b;
            --tile-flame: #ef4444;
            --worm-green: #84cc16;
            --card-bg: #fffdf9;
            --tile-bg: #ece3d2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            background-color: var(--bg-paper);
            color: var(--ink);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 12px;
            overflow: hidden;
            background-image: 
                radial-gradient(#d6cbbd 1px, transparent 1px),
                radial-gradient(circle at 50% 30%, rgba(255,255,255,0.6) 0%, rgba(0,0,0,0.05) 100%);
            background-size: 20px 20px, 100% 100%;
            position: relative;
        }

        .ambient-dust {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .dust-particle {
            position: absolute;
            background: rgba(28, 25, 23, 0.08);
            border-radius: 50%;
            animation: floatParticle 12s infinite linear;
        }

        @keyframes floatParticle {
            0% { transform: translateY(105vh) translateX(0); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(-10vh) translateX(50px); opacity: 0; }
        }

        header, .mascot-container, .game-area, .collection-btn, .controls {
            z-index: 2;
        }

        header {
            width: 100%;
            max-width: 420px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 10px 14px;
            border-radius: 18px;
            border: 3.5px solid var(--ink);
            box-shadow: 4px 4px 0px var(--ink);
            position: relative;
        }

        .version-badge {
            position: absolute;
            top: -10px;
            right: 14px;
            background: var(--ink);
            color: var(--bg-paper);
            font-size: 0.55rem;
            font-weight: 900;
            padding: 2px 6px;
            border-radius: 6px;
            font-family: 'Montserrat', sans-serif;
        }

        .stat-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-label {
            font-size: 0.62rem;
            color: #78716c;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.06em;
        }

        .stat-value {
            font-size: 1.05rem;
            font-weight: 900;
            color: var(--teal);
            font-family: 'Montserrat', sans-serif;
        }

        .stat-value.high-score {
            color: var(--mustard);
        }

        .mascot-container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border-radius: 18px;
            border: 3.5px solid var(--ink);
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 4px 4px 0px var(--ink);
            min-height: 90px;
        }

        .mascot-svg-wrapper {
            width: 72px;
            height: 72px;
            flex-shrink: 0;
            filter: drop-shadow(2px 3px 0px rgba(0,0,0,0.18));
        }

        .speech-bubble {
            background: #fef08a;
            border: 3px solid var(--ink);
            padding: 8px 12px;
            border-radius: 14px;
            font-size: 0.8rem;
            font-weight: 700;
            flex-grow: 1;
            line-height: 1.35;
            max-height: 72px;
            overflow-y: auto;
            box-shadow: 2.5px 2.5px 0px var(--ink);
        }

        .game-area {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            position: relative;
        }

        .word-display {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 0.14em;
            color: var(--teal);
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.12);
        }

        .word-display.valid-word {
            color: var(--blue);
        }

        .grid {
            display: flex;
            flex-direction: column;
            gap: 0px;
            width: 100%;
            background: var(--card-bg);
            padding: 8px;
            border-radius: 22px;
            border: 3.5px solid var(--ink);
            box-shadow: 6px 6px 0px var(--ink);
            position: relative;
            overflow: hidden;
            touch-action: none;
        }

        .row {
            display: flex;
            gap: 0px;
            width: 100%;
            justify-content: center;
        }

        .row.offset {
            transform: translateX(3.5%);
        }

        .tile {
            flex: 1;
            aspect-ratio: 1;
            background: var(--tile-bg);
            border: 2px solid var(--ink);
            margin: -1px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Montserrat', sans-serif;
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--ink);
            cursor: pointer;
            position: relative;
            z-index: 1;
            box-shadow: inset 0 -3px 0 rgba(0,0,0,0.08);
            touch-action: none;
            transition: transform 0.38s cubic-bezier(0.2, 0.8, 0.2, 1);
            will-change: transform;
        }

        .tile.spinning {
            animation: spinTileShuffle 0.4s ease-in-out forwards;
        }

        @keyframes spinTileShuffle {
            0% { transform: scale(1) rotate(0deg); filter: brightness(1); }
            50% { transform: scale(0.6) rotate(180deg) scale(0.8); filter: brightness(1.3); background: var(--mustard); }
            100% { transform: scale(1) rotate(360deg); filter: brightness(1); }
        }

        .tile.fade-in {
            animation: fadeInTile 0.3s ease forwards;
        }

        @keyframes fadeInTile {
            0% { opacity: 0; transform: scale(0.6); }
            100% { opacity: 1; transform: scale(1); }
        }

        .tile.burning-away {
            animation: burnToCrisp 0.85s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            z-index: 5;
        }

        @keyframes burnToCrisp {
            0% { transform: scale(1) rotate(0deg); background: var(--tile-bg); filter: brightness(1); opacity: 1; color: var(--ink); }
            20% { transform: scale(1.12) rotate(-3deg); background: #f59e0b; filter: brightness(1.4); color: #fff; }
            50% { transform: scale(0.95) rotate(6deg); background: #ea580c; filter: brightness(1.8); color: #ffedd5; box-shadow: 0 0 16px #f97316; }
            80% { transform: scale(0.5) rotate(12deg); background: #292524; filter: brightness(0.6); color: #78716c; opacity: 0.7; }
            100% { transform: scale(0.1) rotate(25deg); background: #1c1917; filter: brightness(0.2); opacity: 0; color: #1c1917; }
        }

        .tile.tier-green {
            background: var(--tile-green);
            color: white;
            z-index: 2;
        }

        .tile.tier-green::after {
            content: '+500';
            position: absolute;
            bottom: 2px;
            font-size: 0.42rem;
            font-weight: 900;
            color: #15803d;
            background: rgba(255, 255, 255, 0.9);
            padding: 0px 3px;
            border-radius: 4px;
        }

        .tile.tier-gold {
            background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
            color: white;
            z-index: 2;
        }

        .tile.tier-gold::after {
            content: '+1k';
            position: absolute;
            bottom: 2px;
            font-size: 0.42rem;
            font-weight: 900;
            color: #78350f;
            background: rgba(255, 255, 255, 0.92);
            padding: 0px 3px;
            border-radius: 4px;
        }

        .tile.hazard-flame {
            background: var(--tile-flame);
            color: white;
            animation: flamePulse 0.8s infinite alternate ease-in-out;
            z-index: 2;
        }

        .tile.hazard-flame::after {
            content: '🔥';
            position: absolute;
            top: -6px;
            right: -4px;
            font-size: 0.78rem;
        }

        @keyframes flamePulse {
            0% { transform: scale(1); box-shadow: 0 0 8px rgba(239, 68, 68, 0.6); }
            100% { transform: scale(1.06); box-shadow: 0 0 16px rgba(239, 68, 68, 0.95); }
        }

        .grid.is-animating .tile.hazard-flame {
            animation: none !important;
        }

        .tile.selected {
            background: var(--teal);
            color: white;
            z-index: 7;
            transform: scale(1.06);
            box-shadow: 0 4px 0 rgba(13, 148, 136, 0.5);
        }

        .tile.selected.valid-word {
            background: var(--blue);
            animation: pulseGlow 0.9s infinite alternate ease-in-out;
            z-index: 8;
            box-shadow: 0 4px 0 rgba(2, 132, 199, 0.5);
        }

        @keyframes pulseGlow {
            0% { transform: scale(1.04); }
            100% { transform: scale(1.1); }
        }

        .score-particle {
            position: absolute;
            font-family: 'Montserrat', sans-serif;
            color: var(--mustard);
            font-size: 1.5rem;
            font-weight: 900;
            pointer-events: none;
            animation: floatUpParticle 0.85s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            z-index: 25;
            text-shadow: 2px 2px 0px var(--ink), 0 0 10px rgba(234, 179, 8, 0.6);
        }

        @keyframes floatUpParticle {
            0% { opacity: 1; transform: translateY(0) scale(0.8) rotate(-6deg); }
            50% { transform: translateY(-30px) scale(1.3) rotate(8deg); }
            100% { opacity: 0; transform: translateY(-65px) scale(1.1) rotate(12deg); }
        }

        .controls {
            display: flex;
            gap: 8px;
            width: 100%;
            max-width: 420px;
        }

        button.btn {
            flex: 1;
            padding: 12px 6px;
            border: 3.5px solid var(--ink);
            border-radius: 14px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 3px 3px 0px var(--ink);
        }

        button.btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px var(--ink);
        }

        .btn-clear { background: #d6cbbd; color: var(--ink); }
        .btn-shuffle { background: var(--mustard); color: var(--ink); }
        .btn-submit { background: var(--teal); color: white; opacity: 0.5; pointer-events: none; }

        .btn-submit.valid-word {
            background: var(--blue);
            opacity: 1;
            pointer-events: auto;
            animation: bounceBtn 1s infinite ease-in-out;
        }

        @keyframes bounceBtn {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        .collection-btn {
            width: 100%;
            max-width: 420px;
            background: #84cc16;
            color: var(--ink);
            padding: 9px;
            border: 3.5px solid var(--ink);
            border-radius: 14px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 3px 3px 0px var(--ink);
            text-align: center;
        }

        .collection-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px var(--ink);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(28, 25, 23, 0.75);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: var(--card-bg);
            border: 4px solid var(--ink);
            border-radius: 22px;
            padding: 24px 20px;
            max-width: 360px;
            width: 90%;
            text-align: center;
            box-shadow: 8px 8px 0px var(--ink);
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--teal);
            text-transform: uppercase;
        }

        .category-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            max-height: 52vh;
            overflow-y: auto;
            text-align: left;
            padding-right: 4px;
        }

        .category-group {
            background: #f4efe6;
            border: 2px solid var(--ink);
            border-radius: 10px;
            padding: 8px 10px;
            cursor: pointer;
        }

        .category-header {
            font-size: 0.85rem;
            font-weight: 900;
            color: var(--ink);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .category-words {
            display: none;
            margin-top: 8px;
            padding-top: 6px;
            border-top: 1.5px dashed #d6cbbd;
            font-size: 0.75rem;
            font-weight: 700;
            line-height: 1.5;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .category-group.collapsed .category-words {
            display: none;
        }

        .category-group:not(.collapsed) .category-words {
            display: flex;
        }

        .word-badge {
            background: #e2d9cc;
            padding: 2px 6px;
            border-radius: 4px;
            color: #78716c;
            border: 1px solid #d6cbbd;
        }

        .word-badge.discovered {
            background: #fef08a;
            color: var(--ink);
            border-color: var(--ink);
        }

        .word-badge.tier-blue-word { background: var(--blue); color: white; }
        .word-badge.tier-silver-word { background: var(--silver); color: white; }
        .word-badge.tier-gold-word { background: var(--gold); color: white; }

        .btn-restart {
            background: var(--mustard);
            color: var(--ink);
            padding: 11px 20px;
            border: 3.5px solid var(--ink);
            border-radius: 14px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 3px 3px 0px var(--ink);
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="ambient-dust" id="ambient-dust"></div>

    <header>
        <div class="version-badge">v.0.0.033</div>
        <div class="stat-group">
            <span class="stat-label">Score</span>
            <span id="score" class="stat-value">0</span>
        </div>
        <div class="stat-group">
            <span class="stat-label">Best</span>
            <span id="high-score" class="stat-value high-score">0</span>
        </div>
        <div class="stat-group">
            <span class="stat-label">Level</span>
            <span id="level" class="stat-value">1</span>
        </div>
        <div class="stat-group">
            <span class="stat-label">Target</span>
            <span id="target" class="stat-value">5,000</span>
        </div>
    </header>

    <div class="mascot-container">
        <div class="mascot-svg-wrapper" id="mascot-avatar"></div>
        <div class="speech-bubble" id="speech-text">
            v.0.0.033 Ready! Hold-spam sound bug fixed! 📚✨
        </div>
    </div>

    <div class="game-area" id="game-area">
        <div class="word-display" id="current-word"></div>
        <div class="grid" id="grid"></div>
    </div>

    <button class="collection-btn" onclick="openCollectionModal()">📖 View Collection Categories</button>

    <div class="controls">
        <button class="btn btn-clear" onclick="clearSelection()">Clear</button>
        <button class="btn btn-shuffle" onclick="shuffleGrid()">Shuffle</button>
        <button class="btn btn-submit" id="submit-btn" onclick="submitWord()">Submit</button>
    </div>

    <div class="modal-overlay" id="collection-modal">
        <div class="modal-card" onclick="event.stopPropagation()">
            <div class="modal-title">Word Collection</div>
            <div style="font-size: 0.8rem; font-weight: 700; color: #78716c;">
                Discovered: <span id="collection-count">0</span> / 400 words
            </div>
            <div class="category-list" id="category-list-container"></div>
            <button class="btn-restart" onclick="closeCollectionModal()">Close Drawer</button>
        </div>
    </div>

    <div class="modal-overlay" id="game-over-modal">
        <div class="modal-card">
            <div class="modal-title" style="color: var(--tile-flame);">Game Over! 🔥</div>
            <div class="modal-body" id="game-over-text" style="font-size: 0.95rem; font-weight: 700;">
                A flaming red letter burned through the bottom of your board!
            </div>
            <button class="btn-restart" onclick="resetGame()">Play Again</button>
        </div>
    </div>

    <script>
        const STANDARD_LETTERS = ["E","E","E","E","E","A","A","A","L","L","L","R","R","R","T","T","T","N","N","N","O","O","O","I","I","I","S","S","S","D","D","F","F","G","G","H","H","L","M","M","P","P","B","B","W","W","Y","Y","V","V","J"];
        const CHALLENGING_LETTERS = ["K", "QU", "X", "Z"];
        const CHALLENGING_KEYS = ["K", "QU", "X", "Z", "Q"];

        const GRID_SIZE = 7;
        const TOTAL_TILES = GRID_SIZE * GRID_SIZE;
        
        let gridState = [];
        let selectedIndices = [];
        let currentWordString = "";
        let isCurrentWordValid = false;
        let validDefinitionText = "";
        let isAnimating = false;
        let isDragging = false;
        let lastProcessedIndex = null; // Tracks the last tile interacted with during a drag/hold
        let tileRects = [];
        let nextTileId = 1;

        let score = 0;
        let highScore = parseInt(localStorage.getItem('bookley_high_score') || '0', 10);
        let level = 1;
        let targetScore = 5000;
        let shufflePenaltyCount = 0;

        const WORD_CATEGORIES = {

            "Colors": ["BLUE", "PINK", "GOLD", "TEAL", "GREY", "ROSE", "RUBY", "LIME", "CYAN", "NAVY", "PLUM", "SAGE", "BLACK", "WHITE", "GREEN", "BROWN", "PURPLE", "ORANGE", "YELLOW", "MAGENTA"],

            "Music": ["BAND", "SONG", "TUNE", "BASS", "DRUM", "CHOIR", "NOTE", "ROCK", "JAZZ", "POP", "RAP", "HORN", "AUDIO", "CHORD", "PIANO", "GUITAR", "SINGER", "CONCERT", "MELODY", "SYMPHONY"],

        function playSound(type) {
            try {
                initAudio();
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;

                if (type === 'tap') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(320, now);
                    osc.frequency.exponentialRampToValueAtTime(520, now + 0.08);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'burn') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(120, now);
                    osc.frequency.linearRampToValueAtTime(250, now + 0.4);
                    osc.frequency.linearRampToValueAtTime(50, now + 0.85);
                    gain.gain.setValueAtTime(0.22, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.85);
                    osc.start(now);
                    osc.stop(now + 0.85);
                } else if (type === 'shuffle') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'submit') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.08);
                    osc.frequency.setValueAtTime(880, now + 0.16);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'gameover') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(250, now);
                    osc.frequency.exponentialRampToValueAtTime(80, now + 0.6);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                    osc.start(now);
                    osc.stop(now + 0.6);
                } else if (type === 'levelup') {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.type = 'square';
                        o.frequency.setValueAtTime(freq, now + idx * 0.1);
                        o.connect(g);
                        g.connect(audioCtx.destination);
                        g.gain.setValueAtTime(0.08, now + idx * 0.1);
                        g.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.1 + 0.2);
                        o.start(now + idx * 0.1);
                        o.stop(now + idx * 0.1 + 0.2);
                    });
                }
            } catch(e) {}
        }

        function shuffleGrid() {
            if (isAnimating) return;
            isAnimating = true;
            playSound('shuffle');
            clearSelection();

            shufflePenaltyCount++;

            let movableTiles = [];
            let flamePositions = [];

            gridState.forEach((tile, idx) => {
                if (tile && tile.bonus === 'flame') {
                    flamePositions.push({ index: idx, tile: tile });
                } else {
                    movableTiles.push(tile);
                }
            });

            for (let i = movableTiles.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [movableTiles[i], movableTiles[j]] = [movableTiles[j], movableTiles[i]];
            }

            let newGridState = new Array(TOTAL_TILES);
            flamePositions.forEach(item => {
                newGridState[item.index] = item.tile;
            });

            for (let i = 0; i < TOTAL_TILES; i++) {
                if (!newGridState[i]) {
                    newGridState[i] = movableTiles.shift();
                }
            }

            gridState = newGridState;

            let topRowIndices = [];
            for (let c = 0; c < GRID_SIZE; c++) {
                topRowIndices.push(c);
            }
            topRowIndices.sort(() => Math.random() - 0.5);

            let addedFlames = 0;
            for (let i = 0; i < topRowIndices.length && addedFlames < shufflePenaltyCount; i++) {
                let idx = topRowIndices[i];
                gridState[idx] = { id: nextTileId++, letter: getRandomLetter(), bonus: 'flame' };
                addedFlames++;
            }

            renderGridWithSpinAnimation();
            setMascot(`Shuffle penalty applied! ${shufflePenaltyCount} flame tile(s) added to top row! 🔥🔀`, "scared");

            setTimeout(() => {
                isAnimating = false;
            }, 420);
        }

                    const oldRect = oldRects.get(id);
                    const newRect = el.getBoundingClientRect();
                    const deltaX = oldRect.left - newRect.left;
                    const deltaY = oldRect.top - newRect.top;

                    if (deltaX !== 0 || deltaY !== 0) {
                        el.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
                        el.style.transition = 'none';

                        requestAnimationFrame(() => {

        function getTileIndexAtCoords(clientX, clientY) {
            for (let idx = 0; idx < tileRects.length; idx++) {
                const r = tileRects[idx];
                if (r && clientX >= r.left && clientX <= r.right && clientY >= r.top && clientY <= r.bottom) {
                    return idx;
                }
            }
            return null;
        }

        gridEl.addEventListener('pointerdown', (e) => {
            if (isAnimating) return;
            cacheTileRects();
            const index = getTileIndexAtCoords(e.clientX, e.clientY);
            if (index !== null) {
                isDragging = true;
                lastProcessedIndex = null; // Reset hold tracker on new touch/click
                try { e.target.setPointerCapture(e.pointerId); } catch(err) {}
                processTileSelection(index);
            }
        });

        gridEl.addEventListener('pointermove', (e) => {
            if (!isDragging || isAnimating) return;
            const index = getTileIndexAtCoords(e.clientX, e.clientY);
            if (index !== null) {
                processTileSelection(index);
            }
        });

        window.addEventListener('pointerup', () => { isDragging = false; lastProcessedIndex = null; });
        window.addEventListener('pointercancel', () => { isDragging = false; lastProcessedIndex = null; });

        function processTileSelection(index) {
            // Prevent spamming / infinite toggling if holding down on the same tile continuously
            if (index === lastProcessedIndex) return;
            lastProcessedIndex = index;

            const lastIdx = selectedIndices.length > 0 ? selectedIndices[selectedIndices.length - 1] : null;
            if (lastIdx === index && selectedIndices.length > 1) return;

            const existingPos = selectedIndices.indexOf(index);

            if (existingPos > -1) {
                if (existingPos === 0 && selectedIndices.length === 1) {
                    clearSelection();
                    return;
                }
                if (existingPos === selectedIndices.length - 1) {
                    selectedIndices.pop();
                    playSound('tap');
                    updateCurrentWord();
                    renderGridInitial();
                    return;
                }
                if (existingPos < selectedIndices.length - 1) {
                    selectedIndices = selectedIndices.slice(0, existingPos + 1);
                    playSound('tap');
                    updateCurrentWord();
                    renderGridInitial();
                    return;
                }
            }

            if (selectedIndices.length === 0 || !areTilesAdjacent(lastIdx, index)) {
                selectedIndices = [index];
                playSound('tap');
                updateCurrentWord();
                renderGridInitial();
            } else {
                selectedIndices.push(index);
                playSound('tap');
                updateCurrentWord();
                renderGridInitial();
            }
        }

        function areTilesAdjacent(index1, index2) {
            if (index1 === null || index2 === null) return false;
            const row1 = Math.floor(index1 / GRID_SIZE);
            const col1 = index1 % GRID_SIZE;
            const row2 = Math.floor(index2 / GRID_SIZE);
            const col2 = index2 % GRID_SIZE;

            const rowDiff = Math.abs(row1 - row2);
            const colDiff = Math.abs(col1 - col2);

            if (rowDiff === 0 && colDiff === 0) return false;
            if (rowDiff === 0) return colDiff === 1;

            if (rowDiff === 1) {
                if (row1 % 2 === 0) {
                    return col2 === col1 || col2 === col1 - 1;
                } else {
                    return col2 === col1 || col2 === col1 + 1;
                }
            }

            return false;
        }

        // --- ONLINE VALIDATION (MIN 3 LETTERS + FREQUENCY FILTER + OVERRIDE LIST) ---
        async function updateCurrentWord() {
            currentWordString = selectedIndices.map(i => gridState[i].letter).join('');
            wordEl.textContent = currentWordString;
            isCurrentWordValid = false;
            validDefinitionText = "";

            if (currentWordString.length >= 3) {
                const word = currentWordString.toUpperCase();

                if (onlineSessionCache[word] !== undefined) {
                    isCurrentWordValid = onlineSessionCache[word].valid;
                    validDefinitionText = onlineSessionCache[word].def;
                    updateButtonStates();
                    renderGridInitial();
                    return;
                }

                if (OVERRIDE_WORDS.has(word)) {
                    let def = `Valid colloquial/slang term (${word.length} letters).`;
                    onlineSessionCache[word] = { valid: true, def: def };
                    isCurrentWordValid = true;
                    validDefinitionText = def;
                    updateButtonStates();
                    renderGridInitial();
                    return;
                }

                try {
                    const res = await fetch(`https://api.datamuse.com/words?sp=${word.toLowerCase()}&qe=1&md=df&max=1`);
                    if (res.ok) {
                        const data = await res.json();
                        if (data.length > 0 && data[0].word.toUpperCase() === word) {
                            
                            let freqScore = 0;
                            if (data[0].tags) {
                                for (let tag of data[0].tags) {
                                    if (tag.startsWith('f:')) {
                                        freqScore = parseFloat(tag.substring(2));
                                        break;
                                    }
                                }
                            }

                            const MIN_FREQUENCY_THRESHOLD = 1.2;
                            
                            let isInCategory = false;
                            for (let cat in WORD_CATEGORIES) {
                                if (WORD_CATEGORIES[cat].includes(word)) {
                                    isInCategory = true;
                                    break;
                                }
                            }

                            if (freqScore >= MIN_FREQUENCY_THRESHOLD || isInCategory) {
                                let def = `Valid common word (${word.length} letters).`;
                                if (data[0].defs && data[0].defs.length > 0) {
                                    let rawDef = data[0].defs[0];
                                    if (rawDef.includes('\t')) {
                                        let parts = rawDef.split('\t');
                                        def = `(${parts[0].toUpperCase()}) ${parts[1]}`;
                                    } else {
                                        def = rawDef;
                                    }
                                }

                                onlineSessionCache[word] = { valid: true, def: def };
                                
                                if (currentWordString.toUpperCase() === word) {
                                    isCurrentWordValid = true;
                                    validDefinitionText = def;
                                    updateButtonStates();
                                    renderGridInitial();
                                }
                            } else {
                                onlineSessionCache[word] = { valid: false, def: "" };
                            }
                        } else {
                            onlineSessionCache[word] = { valid: false, def: "" };
                        }
                    }
                } catch (e) {}
            }
            updateButtonStates();
            renderGridInitial();
        }

        function clearSelection() {
            selectedIndices = [];
            isCurrentWordValid = false;
            currentWordString = "";
            wordEl.textContent = "";
            playSound('tap');
            renderGridInitial();
        }

        function spawnFloatingScore(points) {
            const particle = document.createElement('div');
            particle.className = 'score-particle';
            particle.textContent = `+${points}`;
            particle.style.left = `calc(50% - 25px)`;
            particle.style.top = `36%`;
            
            document.getElementById('game-area').appendChild(particle);
            setTimeout(() => particle.remove(), 850);
        }

        async function advanceFlamingHazards(usedFlameIndices) {
            let gameOverTriggered = false;
            let movesToAdvance = [];

            for (let row = 0; row < GRID_SIZE; row++) {
                for (let col = 0; col < GRID_SIZE; col++) {
                    let idx = row * GRID_SIZE + col;
                    let tile = gridState[idx];

                    if (tile && tile.bonus === 'flame' && !usedFlameIndices.includes(idx)) {
                        if (row === GRID_SIZE - 1) {
                            gameOverTriggered = true;
                        } else {
                            let nextRow = row + 1;
                            let possibleCols = [];
                            if (row % 2 === 0) {
                                possibleCols = [col, col - 1];
                            } else {
                                possibleCols = [col, col + 1];
                            }

                            let targetCol = col;
                            for (let c of possibleCols) {
                                if (c >= 0 && c < GRID_SIZE) {
                                    let candidateIdx = nextRow * GRID_SIZE + c;
                                    if (gridState[candidateIdx] !== null) {
                                        targetCol = c;
                                        break;
                                    }
                                }
                            }

                            let targetIdx = nextRow * GRID_SIZE + targetCol;
                            
                            if (gridState[targetIdx] !== null) {
                                movesToAdvance.push({ fromIdx: idx, targetIdx: targetIdx, tileObj: tile });
                            }
                        }
                    }
                }
            }

            if (movesToAdvance.length > 0 && !gameOverTriggered) {
                playSound('burn');

                let eatenTileIds = new Set();
                movesToAdvance.forEach(m => {
                    if (gridState[m.targetIdx]) {
                        eatenTileIds.add(gridState[m.targetIdx].id);
                    }
                });

                movesToAdvance.forEach(m => {
                    gridState[m.targetIdx] = m.tileObj;
                    gridState[m.fromIdx] = { id: nextTileId++, letter: getRandomLetter(), isNewSpawn: true };
                });

                await renderGridFLIP('0.85s', eatenTileIds);
            }

            return gameOverTriggered;
        }

        async function submitWord() {
            if (isAnimating) return;

            if (!isCurrentWordValid) {
                setMascot(`Words must be at least 3 letters long and common!`, "error");
                return;
            }

            playSound('submit');
            isAnimating = true;
            const word = currentWordString.toUpperCase();
            const definitionText = validDefinitionText || "A word.";
            const savedIndices = [...selectedIndices];

            let foundCategory = null;
            let isNewDiscovery = false;

            for (let cat in WORD_CATEGORIES) {
                if (WORD_CATEGORIES[cat].includes(word)) {
                    foundCategory = cat;
                    if (!discoveredWords[cat]) discoveredWords[cat] = [];
                    if (!discoveredWords[cat].includes(word)) {
                        discoveredWords[cat].push(word);
                        localStorage.setItem('bookley_discovered', JSON.stringify(discoveredWords));
                        isNewDiscovery = true;
                    }
                    break;
                }
            }

            let basePoints = word.length * word.length * 25;
            let bonusPoints = 0;
            let flamesExtinguished = 0;
            let usedChallengingLetter = false;

            savedIndices.forEach(idx => {
                const tile = gridState[idx];
                if (tile.bonus === 'green') bonusPoints += 500;
                if (tile.bonus === 'gold') bonusPoints += 1000;
                if (tile.bonus === 'flame') {
                    bonusPoints += 300;
                    flamesExtinguished++;
                }
                if (CHALLENGING_KEYS.includes(tile.letter)) {
                    usedChallengingLetter = true;
                }
            });

            let totalPointsEarned = basePoints + bonusPoints;
            if (usedChallengingLetter) {
                totalPointsEarned = Math.round(totalPointsEarned * 1.20);
            }

            score += totalPointsEarned;
            scoreEl.textContent = score.toLocaleString();
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('bookley_high_score', highScore);
                highScoreEl.textContent = highScore.toLocaleString();
            }

            spawnFloatingScore(totalPointsEarned);

            let bonusTileTypeToSpawn = null;
            if (word.length >= 7) bonusTileTypeToSpawn = 'gold';
            else if (word.length >= 5) bonusTileTypeToSpawn = 'green';

            renderGridInitial();
            await new Promise(r => setTimeout(r, 200));

            savedIndices.forEach(i => {
                gridState[i] = null;
            });

            let bonusInjected = false;

            for (let col = 0; col < GRID_SIZE; col++) {
                let columnTiles = [];
                for (let row = GRID_SIZE - 1; row >= 0; row--) {
                    let idx = row * GRID_SIZE + col;
                    if (gridState[idx] !== null) {
                        columnTiles.push(gridState[idx]);
                    }
                }

                for (let row = GRID_SIZE - 1; row >= 0; row--) {
                    let idx = row * GRID_SIZE + col;
                    if (columnTiles.length > 0) {
                        gridState[idx] = columnTiles.shift();
                        gridState[idx].isNewSpawn = false;
                    } else {
                        let bType = null;
                        if (bonusTileTypeToSpawn && !bonusInjected) {
                            bType = bonusTileTypeToSpawn;
                            bonusInjected = true;
                        } else if (Math.random() < 0.08) {
                            bType = 'flame';
                        }
                        gridState[idx] = { id: nextTileId++, letter: getRandomLetter(), bonus: bType, isNewSpawn: true };
                    }
                }
            }

            selectedIndices = [];
            isCurrentWordValid = false;
            currentWordString = "";
            wordEl.textContent = "";

            await renderGridFLIP('0.38s');

            const isGameOver = await advanceFlamingHazards(savedIndices);

            if (isGameOver) {
                triggerGameOver("A flaming red letter reached the bottom and burned through your board!");
                return;
            }

            let speechNote = `"${word}": ${definitionText}`;
            let mascotExp = "happy";

            if (foundCategory) {
                speechNote += ` 🏆 (Added to ${foundCategory} Collection!)`;
                mascotExp = "celebrate";
                if (isNewDiscovery) {
                    setTimeout(() => {
                        openCollectionModal(foundCategory, word);
                    }, 400);
                }
            } else if (usedChallengingLetter) {
                speechNote += ` 🌟 (+20% bonus for challenging letter!)`;
                mascotExp = "celebrate";
            } else if (flamesExtinguished > 0) {
                speechNote += ` 🔥 (Extinguished ${flamesExtinguished} flame tile!)`;
                mascotExp = "celebrate";
            } else if (bonusPoints > 0) {
                speechNote += ` 🌟 (Bonus tile used!)`;
                mascotExp = "celebrate";
            }

            setMascot(speechNote, mascotExp);

            setTimeout(() => {
                checkLevelProgress();
            }, 2600);

            setTimeout(() => {
                isAnimating = false;
            }, 200);
        }

        function openCollectionModal(highlightCategory = null, highlightWord = null) {
            const container = document.getElementById('category-list-container');
            container.innerHTML = '';
            let totalDiscovered = 0;
            let targetGroupEl = null;

            for (let cat in WORD_CATEGORIES) {
                const words = WORD_CATEGORIES[cat];
                const found = discoveredWords[cat] || [];
                totalDiscovered += found.length;

                let tier34Done = words.slice(0, 12).every(w => found.includes(w));
                let tier5Done = words.slice(12, 17).every(w => found.includes(w));
                let tier67Done = words.slice(17, 20).every(w => found.includes(w));

                let tierClass = "";
                if (tier67Done) tierClass = "tier-gold";
                else if (tier5Done) tierClass = "tier-silver";
                else if (tier34Done) tierClass = "tier-blue";

                const group = document.createElement('div');
                group.className = 'category-group collapsed';
                if (cat === highlightCategory) {
                    group.classList.remove('collapsed');
                    targetGroupEl = group;
                }

                const header = document.createElement('div');
                header.className = `category-header ${tierClass}`;
                header.innerHTML = `<span>${cat}</span><span>${found.length} / ${words.length} ▾</span>`;

                const wordsContainer = document.createElement('div');
                wordsContainer.className = 'category-words';

                words.forEach((w, idx) => {
                    const badge = document.createElement('span');
                    badge.className = 'word-badge';
                    
                    let wordTierColorClass = "discovered";
                    if (found.includes(w)) {
                        if (idx < 12) wordTierColorClass = "tier-blue-word";
                        else if (idx < 17) wordTierColorClass = "tier-silver-word";
                        else wordTierColorClass = "tier-gold-word";
                        badge.classList.add(wordTierColorClass);
                    }

                    if (cat === highlightCategory && w === highlightWord) {
                        badge.classList.add('reveal-anim', wordTierColorClass);
                    }

                    badge.textContent = w;
                    wordsContainer.appendChild(badge);
                });

                group.onclick = () => {
                    group.classList.toggle('collapsed');
                };

                group.appendChild(header);
                group.appendChild(wordsContainer);
                container.appendChild(group);
            }

            document.getElementById('collection-count').textContent = totalDiscovered;
            const modal = document.getElementById('collection-modal');
            modal.classList.add('active');

            modal.onclick = (e) => {
                if (e.target === modal) {
                    closeCollectionModal();
                }
            };

            if (targetGroupEl) {
                setTimeout(() => {
                    targetGroupEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }, 150);
            }
        }

        function closeCollectionModal() {
            document.getElementById('collection-modal').classList.remove('active');
        }

        function checkLevelProgress() {
            if (score >= targetScore) {
                level++;
                targetScore += Math.round(5000 * Math.pow(1.6, level - 1));
                levelEl.textContent = level;
                targetEl.textContent = targetScore.toLocaleString();
                playSound('levelup');
                setMascot(`Level ${level} achieved! Brilliant work! 🎉`, "celebrate");
            }
        }

        function triggerGameOver(reason) {
            playSound('gameover');
            document.getElementById('game-over-text').textContent = reason;
            document.getElementById('game-over-modal').classList.add('active');
            setMascot("Oh no! The fire reached the bottom! Game over! 😿", "scared");
        }

        function resetGame() {
            document.getElementById('game-over-modal').classList.remove('active');
            score = 0;
            level = 1;
            targetScore = 5000;
            shufflePenaltyCount = 0;
            scoreEl.textContent = "0";
            levelEl.textContent = "1";
            targetEl.textContent = "5,000";
            isAnimating = false;
            clearSelection();
            initGrid();
            setMascot("Fresh start! Keep an eye on those flaming letters! 🔥", "happy");
        }

        function setMascot(text, expression) {
            speechEl.textContent = text;
            renderMascot(expression);
        }

        renderMascot('neutral');
        initAmbientDust();
        initGrid();
    </script>
</body>
</html>
