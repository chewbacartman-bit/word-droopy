        }

        }

        }
        [data-theme="neon"] {
            --bg-paper: #09090b; --ink: #fafafa; --mustard: #e879f9; --teal: #22d3ee; --blue: #818cf8; --silver: #71717a; --gold: #f43f5e; --tile-green: #34d399; --tile-gold: #f43f5e; --tile-flame: #ef4444; --worm-green: #22d3ee; --card-bg: #18181b; --tile-bg: #27272a; --dust-particle: rgba(34, 211, 238, 0.08); --bg-image: radial-gradient(#27272a 1.5px, transparent 1.5px); --bg-size: 22px 22px;

        [data-theme="solarized"] {
            --bg-paper: #eee8d5; --ink: #073642; --mustard: #b58900; --teal: #2aa198; --blue: #268bd2; --silver: #657b83; --gold: #cb4b16; --tile-green: #859900; --tile-gold: #b58900; --tile-flame: #dc322f; --worm-green: #859900; --card-bg: #fdf6e3; --tile-bg: #eee8d5; --dust-particle: rgba(7, 54, 66, 0.06); --bg-image: radial-gradient(#d3cbb7 1px, transparent 1px); --bg-size: 20px 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            background-color: var(--bg-paper);
            color: var(--ink);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 12px;
            overflow: hidden;
            background-image: var(--bg-image);
            background-size: var(--bg-size);
            position: relative;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        .ambient-dust {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .dust-particle {
            position: absolute;
            background: var(--dust-particle);
            border-radius: 50%;
            animation: floatParticle 12s infinite linear;
        }

        @keyframes floatParticle {
            0% { transform: translateY(105vh) translateX(0); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(-10vh) translateX(50px); opacity: 0; }
        }

        header, .mascot-container, .game-area, .menu-buttons-row, .controls {
            z-index: 2;
        }

        header {
            width: 100%;
            max-width: 420px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 10px 14px;
            border-radius: 18px;
            border: 3.5px solid var(--ink);
            box-shadow: 4px 4px 0px var(--ink);
            position: relative;
            transition: background 0.4s ease, border-color 0.4s ease;
        }

        .version-badge {
            position: absolute;
            top: -10px;
            right: 14px;
            background: var(--ink);
            color: var(--bg-paper);
            font-size: 0.55rem;
            font-weight: 900;
            padding: 2px 6px;
            border-radius: 6px;
            font-family: 'Montserrat', sans-serif;
        }

        .stat-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-label {
            font-size: 0.62rem;
            color: var(--silver);
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.06em;
        }

        .stat-value {
            font-size: 1.05rem;
            font-weight: 900;
            color: var(--teal);
            font-family: 'Montserrat', sans-serif;
        }

        .stat-value.high-score {
            color: var(--mustard);
        }

        .mascot-container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border-radius: 18px;
            border: 3.5px solid var(--ink);
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 4px 4px 0px var(--ink);
            min-height: 125px;
            transition: background 0.4s ease, border-color 0.4s ease;
            position: relative;
        }

        .mascot-svg-wrapper {
            width: 82px;
            height: 82px;
            flex-shrink: 0;
            filter: drop-shadow(2px 3px 0px rgba(0,0,0,0.18));
            position: relative;
        }

        .praise-bubble {
            position: absolute;
            top: -16px;
            left: -8px;
            background: var(--mustard);
            color: var(--ink);
            border: 2.5px solid var(--ink);
            padding: 3px 7px;
            border-radius: 10px;
            font-size: 0.65rem;
            font-weight: 900;
            font-family: 'Montserrat', sans-serif;
            box-shadow: 2px 2px 0px var(--ink);
            transform: rotate(-10deg) scale(0);
            transform-origin: bottom right;
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
            pointer-events: none;
            white-space: nowrap;
        }

        .praise-bubble.active {
            transform: rotate(-6deg) scale(1);
        }

        .speech-bubble {
            background: var(--tile-bg);
            border: 3px solid var(--ink);
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 0.82rem;
            font-weight: 700;
            flex-grow: 1;
            line-height: 1.4;
            max-height: 120px;
            overflow-y: auto;
            box-shadow: 2.5px 2.5px 0px var(--ink);
            display: flex;
            align-items: center;
        }

        .game-area {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            position: relative;
        }

        .bounty-banner {
            width: 100%;
            background: var(--card-bg);
            border: 2.5px solid var(--ink);
            border-radius: 12px;
            padding: 6px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.78rem;
            font-weight: 900;
            box-shadow: 3px 3px 0px var(--ink);
            transition: background 0.4s ease, border-color 0.4s ease;
        }

        .bounty-letters {
            display: flex;
            gap: 4px;
        }

        .bounty-letter-slot {
            width: 22px;
            height: 24px;
            background: var(--tile-bg);
            border: 2px solid var(--ink);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            color: var(--silver);
            transition: all 0.2s ease;
        }

        .bounty-letter-slot.lit {
            background: var(--mustard);
            color: var(--ink);
            transform: translateY(-2px);
            box-shadow: 0 2px 0 var(--ink);
        }

        .bounty-letter-slot.completed {
            background: var(--teal);
            color: white;
            animation: pulseSlot 0.8s infinite alternate ease-in-out;
        }

        @keyframes pulseSlot {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        .word-display {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: 0.14em;
            color: var(--teal);
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.12);
            gap: 8px;
        }

        .word-display.valid-word {
            color: var(--blue);
        }

        .grid {
            display: flex;
            flex-direction: column;
            gap: 0px;
            width: 100%;
            background: var(--card-bg);
            padding: 8px;
            border-radius: 22px;
            border: 3.5px solid var(--ink);
            box-shadow: 6px 6px 0px var(--ink);
            position: relative;
            overflow: hidden;
            touch-action: none;
            perspective: 800px;
            transition: background 0.4s ease, border-color 0.4s ease;
        }

        .row {
            display: flex;
            gap: 0px;
            width: 100%;
            justify-content: center;
        }

        .row.offset {
            transform: translateX(3.5%);
        }

        .tile {
            flex: 1;
            aspect-ratio: 1;
            background: var(--tile-bg);
            border: 2px solid var(--ink);
            margin: -1px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Montserrat', sans-serif;
            font-size: 1.15rem;
            font-weight: 900;
            color: var(--ink);
            cursor: pointer;
            position: relative;
            z-index: 1;
            box-shadow: inset 0 -3px 0 rgba(0,0,0,0.08);
            touch-action: none;
            transition: background-color 0.4s ease, 
                        color 0.4s ease, 
                        box-shadow 0.4s ease,
                        transform 0.38s cubic-bezier(0.2, 0.8, 0.2, 1);
            will-change: transform, background-color, color, box-shadow;
        }

        .tile.flipping {
            animation: flipTileSmooth 0.52s ease-in-out forwards;
        }

        @keyframes flipTileSmooth {
            0% { transform: rotateY(0deg) scale(1); filter: brightness(1); }
            50% { transform: rotateY(90deg) scale(0.92); filter: brightness(1.2); background: var(--mustard); }
            100% { transform: rotateY(0deg) scale(1); filter: brightness(1); }
        }

        .tile.igniting-ember {
            background-color: #292524 !important;
            color: #fdba74 !important;
            box-shadow: inset 0 0 10px #ea580c, 0 0 12px #c2410c !important;
            transform: scale(0.95) rotate(-2deg) !important;
        }

        .tile.igniting-flame {
            background-color: var(--tile-flame) !important;
            color: #ffffff !important;
            box-shadow: 0 0 16px rgba(239, 68, 68, 0.9) !important;
            transform: scale(1.08) rotate(2deg) !important;
        }

        .tile.fade-in {
            animation: fadeInTile 0.3s ease forwards;
        }

        @keyframes fadeInTile {
            0% { opacity: 0; transform: scale(0.6); }
            100% { opacity: 1; transform: scale(1); }
        }

        .tile.burning-away {
            animation: burnToCrisp 0.85s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            z-index: 5;
        }

        @keyframes burnToCrisp {
            0% { transform: scale(1) rotate(0deg); background: var(--tile-bg); filter: brightness(1); opacity: 1; color: var(--ink); }
            20% { transform: scale(1.12) rotate(-3deg); background: #f59e0b; filter: brightness(1.4); color: #fff; }
            50% { transform: scale(0.95) rotate(6deg); background: #ea580c; filter: brightness(1.8); color: #ffedd5; box-shadow: 0 0 16px #f97316; }
            80% { transform: scale(0.5) rotate(12deg); background: #292524; filter: brightness(0.6); color: #78716c; opacity: 0.7; }
            100% { transform: scale(0.1) rotate(25deg); background: #1c1917; filter: brightness(0.2); opacity: 0; color: #1c1917; }
        }

        .tile.tier-green {
            background: var(--tile-green);
            color: white;
            z-index: 2;
        }

        .tile.tier-green::after {
            content: '+500';
            position: absolute;
            bottom: 2px;
            font-size: 0.42rem;
            font-weight: 900;
            color: rgba(255,255,255,0.9);
            background: rgba(0, 0, 0, 0.25);
            padding: 0px 3px;
            border-radius: 4px;
        }

        .tile.tier-gold {
            background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
            color: white;
            z-index: 2;
        }

        .tile.tier-gold::after {
            content: '+1k';
            position: absolute;
            bottom: 2px;
            font-size: 0.42rem;
            font-weight: 900;
            color: rgba(255,255,255,0.95);
            background: rgba(0, 0, 0, 0.25);
            padding: 0px 3px;
            border-radius: 4px;
        }

        .tile.hazard-flame {
            background: var(--tile-flame);
            color: white;
            animation: flamePulse 0.8s infinite alternate ease-in-out;
            z-index: 2;
        }

        .tile.hazard-flame::after {
            content: '🔥';
            position: absolute;
            top: -6px;
            right: -4px;
            font-size: 0.78rem;
        }

        @keyframes flamePulse {
            0% { transform: scale(1); box-shadow: 0 0 8px rgba(239, 68, 68, 0.6); }
            100% { transform: scale(1.06); box-shadow: 0 0 16px rgba(239, 68, 68, 0.95); }
        }

        .grid.is-animating .tile.hazard-flame {
            animation: none !important;
        }

        .tile.selected {
            background: var(--teal);
            color: white;
            z-index: 7;
            transform: scale(1.06);
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3);
        }

        .tile.selected.valid-word {
            background: var(--blue);
            animation: pulseGlow 0.9s infinite alternate ease-in-out;
            z-index: 8;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3);
        }

        @keyframes pulseGlow {
            0% { transform: scale(1.04); }
            100% { transform: scale(1.1); }
        }

        .score-particle {
            position: absolute;
            font-family: 'Montserrat', sans-serif;
            color: var(--mustard);
            font-size: 1.5rem;
            font-weight: 900;
            pointer-events: none;
            animation: floatUpParticle 0.85s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            z-index: 25;
            text-shadow: 2px 2px 0px var(--ink), 0 0 10px rgba(234, 179, 8, 0.6);
        }

        @keyframes floatUpParticle {
            0% { opacity: 1; transform: translateY(0) scale(0.8) rotate(-6deg); }
            50% { transform: translateY(-30px) scale(1.3) rotate(8deg); }
            100% { opacity: 0; transform: translateY(-65px) scale(1.1) rotate(12deg); }
        }

        .menu-buttons-row {
            display: flex;
            gap: 8px;
            width: 100%;
            max-width: 420px;
        }

        .menu-btn {
            flex: 1;
            background: var(--card-bg);
            color: var(--ink);
            padding: 9px 6px;
            border: 3.5px solid var(--ink);
            border-radius: 14px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.78rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 3px 3px 0px var(--ink);
            text-align: center;
            transition: background 0.4s ease, color 0.4s ease;
        }

        .menu-btn:active {
            transform: translate(2px, 2px);

        function initAmbientDust() {
            const container = document.getElementById('ambient-dust');
            container.innerHTML = '';
            for (let i = 0; i < 15; i++) {
                const p = document.createElement('div');
                p.className = 'dust-particle';
                const size = Math.random() * 6 + 3;
                p.style.width = `${size}px`;
                p.style.height = `${size}px`;
                p.style.left = `${Math.random() * 100}vw`;
                p.style.animationDuration = `${Math.random() * 10 + 8}s`;
                p.style.animationDelay = `${Math.random() * 5}s`;
                container.appendChild(p);

        }

        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            try {
                initAudio();
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;

                if (type === 'tap') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(320, now);
                    osc.frequency.exponentialRampToValueAtTime(520, now + 0.08);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'burn') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(120, now);
                    osc.frequency.linearRampToValueAtTime(250, now + 0.4);
                    osc.frequency.linearRampToValueAtTime(50, now + 0.85);
                    gain.gain.setValueAtTime(0.22, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.85);
                    osc.start(now);
                    osc.stop(now + 0.85);
                } else if (type === 'shuffle') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'submit') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.08);
                    osc.frequency.setValueAtTime(880, now + 0.16);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'bounty') {
                    const notes = [440, 554.37, 659.25, 880];
                    notes.forEach((freq, idx) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.type = 'triangle';
                        o.frequency.setValueAtTime(freq, now + idx * 0.08);
                        o.connect(g);
                        g.connect(audioCtx.destination);
                        g.gain.setValueAtTime(0.12, now + idx * 0.08);
                        g.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.08 + 0.15);
                        o.start(now + idx * 0.08);
                        o.stop(now + idx * 0.08 + 0.15);
                    });
                } else if (type === 'gameover') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(250, now);
                    osc.frequency.exponentialRampToValueAtTime(80, now + 0.6);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                    osc.start(now);
                    osc.stop(now + 0.6);
                } else if (type === 'levelup') {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.type = 'square';
                        o.frequency.setValueAtTime(freq, now + idx * 0.1);
                        o.connect(g);
                        g.connect(audioCtx.destination);
                        g.gain.setValueAtTime(0.08, now + idx * 0.1);
                        g.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.1 + 0.2);
                        o.start(now + idx * 0.1);
                        o.stop(now + idx * 0.1 + 0.2);
                    });
                }
            } catch(e) {}
        }

                ${bubbleHtml}
                <img src="worm.png" alt="Bookley" style="width: 100%; height: 100%; object-fit: contain;">
            `;
        }

        const gridEl = document.getElementById('grid');
        const wordEl = document.getElementById('current-word');
        const submitBtn = document.getElementById('submit-btn');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('high-score');
        const levelEl = document.getElementById('level');
        const targetEl = document.getElementById('target');
        const speechEl = document.getElementById('speech-text');
        const bountyContainerEl = document.getElementById('bounty-letters-container');

        function pickNewBountyWord() {
            const categories = Object.keys(WORD_CATEGORIES);
            const randomCat = categories[Math.floor(Math.random() * categories.length)];
            const words = WORD_CATEGORIES[randomCat];
            currentBountyWord = words[Math.floor(Math.random() * words.length)];
            renderBountySlots("");
        }

        function renderBountySlots(activeMatchCount = 0, isCompleteMatch = false) {
            bountyContainerEl.innerHTML = '';
            for (let i = 0; i < currentBountyWord.length; i++) {
                const slot = document.createElement('div');
                slot.className = 'bounty-letter-slot';
                slot.textContent = currentBountyWord[i];
                if (isCompleteMatch) {
                    slot.classList.add('completed');
                } else if (i < activeMatchCount) {
                    slot.classList.add('lit');
                }
                bountyContainerEl.appendChild(slot);
            }
        }

        function getRandomLetter() {
            const roll = Math.random();
            if (roll < 0.08) {
                return CHALLENGING_LETTERS[Math.floor(Math.random() * CHALLENGING_LETTERS.length)];
            } else if (roll < 0.46) {
                return VOWELS[Math.floor(Math.random() * VOWELS.length)];
            } else {
                return CONSONANTS[Math.floor(Math.random() * CONSONANTS.length)];
            }
        }

        function createTileObject(letter = getRandomLetter(), bonus = null) {
            return { id: nextTileId++, letter, bonus };
        }

        function initGrid() {
            gridState = [];
            for (let i = 0; i < TOTAL_TILES; i++) {
                gridState.push(createTileObject());
            }
            highScoreEl.textContent = highScore.toLocaleString();
            pickNewBountyWord();
            renderGridInitial();
        }

        function shuffleGrid() {
            if (isAnimating) return;
            isAnimating = true;
            playSound('shuffle');
            triggerHaptic(40);
            clearSelection();

            shufflePenaltyCount++;

            let movableTiles = [];
            let existingFlamePositions = [];

            gridState.forEach((tile, idx) => {
                if (tile && tile.bonus === 'flame') {
                    existingFlamePositions.push({ index: idx, tile: tile });
                } else {
                    movableTiles.push(tile);
                }
            });

            for (let i = movableTiles.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [movableTiles[i], movableTiles[j]] = [movableTiles[j], movableTiles[i]];
            }

            let newGridState = new Array(TOTAL_TILES);
            existingFlamePositions.forEach(item => {
                newGridState[item.index] = item.tile;
            });

            for (let i = 0; i < TOTAL_TILES; i++) {
                if (!newGridState[i]) {
                    newGridState[i] = movableTiles.shift();
                }
            }

            gridState = newGridState;

            renderGridWithFlipAnimation();

            const flipDurationMs = 560; 
            setTimeout(() => {
                let topRowIndices = [];
                for (let c = 0; c < GRID_SIZE; c++) {
                    topRowIndices.push(c);
                }
                topRowIndices.sort(() => Math.random() - 0.5);

                let addedFlames = 0;
                let newlyIgnitedIndices = [];

                for (let i = 0; i < topRowIndices.length && addedFlames < shufflePenaltyCount; i++) {
                    let idx = topRowIndices[i];
                    if (gridState[idx].bonus !== 'flame') {
                        let currentTile = gridState[idx];
                        gridState[idx] = {
                            id: currentTile.id,
                            letter: currentTile.letter,
                            bonus: 'flame'
                        };
                        newlyIgnitedIndices.push(idx);
                        addedFlames++;
                    }
                }

                if (newlyIgnitedIndices.length > 0) {
                    playSound('burn');
                    triggerHaptic([50, 50, 50]);
                    
                    newlyIgnitedIndices.forEach(idx => {
                        const tileEl = gridEl.querySelector(`.tile[data-index="${idx}"]`);
                        if (tileEl) {
                            tileEl.classList.remove('flipping');
                            tileEl.classList.add('igniting-ember');
                        }
                    });

                    setTimeout(() => {
                        newlyIgnitedIndices.forEach(idx => {
                            const tileEl = gridEl.querySelector(`.tile[data-index="${idx}"]`);
                            if (tileEl) {
                                tileEl.classList.remove('igniting-ember');
                                tileEl.classList.add('igniting-flame', 'hazard-flame');
                                tileEl.textContent = gridState[idx].letter;
                                tileEl.dataset.tileId = gridState[idx].id;
                            }
                        });
                    }, 300);
                }

                setTimeout(() => {
                    renderGridInitial();
                    isAnimating = false;
                }, 750);

            }, flipDurationMs);
        }

        function renderGridWithFlipAnimation() {
            gridEl.innerHTML = '';
            for (let row = 0; row < GRID_SIZE; row++) {
                const rowEl = document.createElement('div');
                rowEl.classList.add('row');
                if (row % 2 === 1) rowEl.classList.add('offset');

                for (let col = 0; col < GRID_SIZE; col++) {
                    let index = row * GRID_SIZE + col;
                    let tileData = gridState[index];

                    const tile = document.createElement('div');
                    tile.classList.add('tile', 'flipping');
                    
                    let delay = (index * 0.006).toFixed(3);
                    tile.style.animationDelay = `${delay}s`;

                    tile.dataset.index = index;
                    tile.dataset.tileId = tileData ? tileData.id : '';

                    if (tileData) {
                        if (tileData.bonus === 'green') tile.classList.add('tier-green');
                        else if (tileData.bonus === 'gold') tile.classList.add('tier-gold');
                        else if (tileData.bonus === 'flame') tile.classList.add('hazard-flame');
                        tile.textContent = tileData.letter;
                    }

                    rowEl.appendChild(tile);
                }
                gridEl.appendChild(rowEl);
            }
            updateButtonStates();
            setTimeout(cacheTileRects, 10);
        }

        function cacheTileRects() {
            tileRects = [];
            const tileElements = gridEl.querySelectorAll('.tile');
            tileElements.forEach(el => {
                const idx = parseInt(el.dataset.index, 10);
                const rect = el.getBoundingClientRect();
                tileRects[idx] = { left: rect.left, right: rect.right, top: rect.top, bottom: rect.bottom, width: rect.width, height: rect.height };
            });
        }

        function renderGridInitial() {
            gridEl.innerHTML = '';
            for (let row = 0; row < GRID_SIZE; row++) {
                const rowEl = document.createElement('div');
                rowEl.classList.add('row');
                if (row % 2 === 1) rowEl.classList.add('offset');

                for (let col = 0; col < GRID_SIZE; col++) {
                    let index = row * GRID_SIZE + col;
                    let tileData = gridState[index];

                    const tile = document.createElement('div');
                    tile.classList.add('tile');
                    tile.dataset.index = index;
                    tile.dataset.tileId = tileData ? tileData.id : '';

                    if (tileData) {
                        if (tileData.bonus === 'green') tile.classList.add('tier-green');
                        else if (tileData.bonus === 'gold') tile.classList.add('tier-gold');
                        else if (tileData.bonus === 'flame') tile.classList.add('hazard-flame');
                        tile.textContent = tileData.letter;
                    }

                    if (selectedIndices.includes(index)) {
                        tile.classList.add('selected');
                        if (isCurrentWordValid) tile.classList.add('valid-word');
                    }

                    rowEl.appendChild(tile);
                }
                gridEl.appendChild(rowEl);
            }
            updateButtonStates();
            setTimeout(cacheTileRects, 10);
        }

        async function renderGridFLIP(duration = '0.38s', specialBurnIds = new Set()) {
            const oldRects = new Map();
            gridEl.querySelectorAll('.tile').forEach(el => {
                const id = el.dataset.tileId;
                if (id) {
                    oldRects.set(id, el.getBoundingClientRect());
                }
            });

            gridEl.classList.add('is-animating');

            gridEl.innerHTML = '';
            for (let row = 0; row < GRID_SIZE; row++) {
                const rowEl = document.createElement('div');
                rowEl.classList.add('row');
                if (row % 2 === 1) rowEl.classList.add('offset');

                for (let col = 0; col < GRID_SIZE; col++) {
                    let index = row * GRID_SIZE + col;
                    let tileData = gridState[index];

                    const tile = document.createElement('div');
                    tile.classList.add('tile');
                    tile.dataset.index = index;
                    tile.dataset.tileId = tileData ? tileData.id : '';

                    if (tileData) {
                        if (tileData.bonus === 'green') tile.classList.add('tier-green');
                        else if (tileData.bonus === 'gold') tile.classList.add('tier-gold');
                        else if (tileData.bonus === 'flame') tile.classList.add('hazard-flame');
                        tile.textContent = tileData.letter;

                        if (tileData.isNewSpawn) {
                            tile.classList.add('fade-in');
                        }
                        if (specialBurnIds.has(tileData.id)) {
                            tile.classList.add('burning-away');
                        }
                    }

                    if (selectedIndices.includes(index)) {
                        tile.classList.add('selected');
                        if (isCurrentWordValid) tile.classList.add('valid-word');
                    }

                    rowEl.appendChild(tile);
                }
                gridEl.appendChild(rowEl);
            }

            updateButtonStates();

            const newTiles = gridEl.querySelectorAll('.tile');
            newTiles.forEach(el => {
                const id = el.dataset.tileId;
                if (oldRects.has(id)) {
                    const oldRect = oldRects.get(id);
                    const newRect = el.getBoundingClientRect();
                    const deltaX = oldRect.left - newRect.left;
                    const deltaY = oldRect.top - newRect.top;

                    if (deltaX !== 0 || deltaY !== 0) {
                        el.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
                        el.style.transition = 'none';

                        requestAnimationFrame(() => {
                            requestAnimationFrame(() => {
                                el.style.transition = `transform ${duration} cubic-bezier(0.25, 1, 0.5, 1)`;
                                el.style.transform = 'translate(0, 0)';
                            });
                        });
                    }
                }
            });

            const durationMs = parseFloat(duration) * 1000;
            await new Promise(r => setTimeout(r, durationMs + 30));
            
            gridEl.classList.remove('is-animating');
            cacheTileRects();
        }

        function updateButtonStates() {
            if (isCurrentWordValid) {
                wordEl.classList.add('valid-word');
                submitBtn.classList.add('valid-word');
            } else {
                wordEl.classList.remove('valid-word');
                submitBtn.classList.remove('valid-word');
            }
        }

        function getTileIndexAtCoords(clientX, clientY) {
            for (let idx = 0; idx < tileRects.length; idx++) {
                const r = tileRects[idx];
                if (r && clientX >= r.left && clientX <= r.right && clientY >= r.top && clientY <= r.bottom) {
                    return idx;
                }
            }
            return null;
        }

        gridEl.addEventListener('pointerdown', (e) => {
            if (isAnimating) return;
            cacheTileRects();
            const index = getTileIndexAtCoords(e.clientX, e.clientY);
            if (index !== null) {
                isDragging = true;
                lastProcessedIndex = null;
                try { e.target.setPointerCapture(e.pointerId); } catch(err) {}
                processTileSelection(index);
            }
        });

        gridEl.addEventListener('pointermove', (e) => {
            if (!isDragging || isAnimating) return;
            const index = getTileIndexAtCoords(e.clientX, e.clientY);
            if (index !== null) {
                processTileSelection(index);
            }
        });

        window.addEventListener('pointerup', () => { isDragging = false; lastProcessedIndex = null; });
        window.addEventListener('pointercancel', () => { isDragging = false; lastProcessedIndex = null; });

        function processTileSelection(index) {
            if (index === lastProcessedIndex) return;
            lastProcessedIndex = index;

            const lastIdx = selectedIndices.length > 0 ? selectedIndices[selectedIndices.length - 1] : null;
            if (lastIdx === index && selectedIndices.length > 1) return;

            const existingPos = selectedIndices.indexOf(index);

            if (existingPos > -1) {
                if (existingPos === 0 && selectedIndices.length === 1) {
                    clearSelection();
                    return;
                }
                if (existingPos === selectedIndices.length - 1) {
                    selectedIndices.pop();
                    playSound('tap');
                    triggerHaptic(20);
                    updateCurrentWord();
                    renderGridInitial();
                    return;
                }
                if (existingPos < selectedIndices.length - 1) {
                    selectedIndices = selectedIndices.slice(0, existingPos + 1);
                    playSound('tap');
                    triggerHaptic(20);
                    updateCurrentWord();
                    renderGridInitial();
                    return;
                }
            }

            if (selectedIndices.length === 0 || !areTilesAdjacent(lastIdx, index)) {
                selectedIndices = [index];
                playSound('tap');
                triggerHaptic(20);
                updateCurrentWord();
                renderGridInitial();
            } else {
                selectedIndices.push(index);
                playSound('tap');
                triggerHaptic(20);
                updateCurrentWord();
                renderGridInitial();
            }
        }

        function areTilesAdjacent(index1, index2) {
            if (index1 === null || index2 === null) return false;
            const row1 = Math.floor(index1 / GRID_SIZE);
            const col1 = index1 % GRID_SIZE;
            const row2 = Math.floor(index2 / GRID_SIZE);
            const col2 = index2 % GRID_SIZE;

            const rowDiff = Math.abs(row1 - row2);
            const colDiff = Math.abs(col1 - col2);

            if (rowDiff === 0 && colDiff === 0) return false;
            if (rowDiff === 0) return colDiff === 1;

            if (rowDiff === 1) {
                if (row1 % 2 === 0) {
                    return col2 === col1 || col2 === col1 - 1;
                } else {
                    return col2 === col1 || col2 === col1 + 1;
                }
            }

            return false;
        }

        function cleanDefinition(rawDefText) {
            if (!rawDefText) return "A word.";
            let cutIdx = rawDefText.search(/[.;]/);
            if (cutIdx !== -1) {
                return rawDefText.substring(0, cutIdx + 1);
            }
            return rawDefText;
        }

        async function checkApiWord(word) {
            try {
                const res = await fetch(`https://api.datamuse.com/words?sp=${word.toLowerCase()}&qe=1&md=df&max=1`);
                if (res.ok) {
                    const data = await res.json();
                    if (data.length > 0 && data[0].word.toUpperCase() === word) {
                        let freqScore = 0;
                        if (data[0].tags) {
                            for (let tag of data[0].tags) {
                                if (tag.startsWith('f:')) {
                                    freqScore = parseFloat(tag.substring(2));
                                    break;
                                }
                            }
                        }
                        const MIN_FREQUENCY_THRESHOLD = 0.3;
                        let isInCategory = false;
                        for (let cat in WORD_CATEGORIES) {
                            if (WORD_CATEGORIES[cat].includes(word)) {
                                isInCategory = true;
                                break;
                            }
                        }
                        if (freqScore >= MIN_FREQUENCY_THRESHOLD || isInCategory) {
                            let def = `Valid word (${word.length} letters).`;
                            if (data[0].defs && data[0].defs.length > 0) {
                                let rawDef = data[0].defs[0];
                                if (rawDef.includes('\t')) {
                                    let parts = rawDef.split('\t');
                                    def = `(${parts[0].toUpperCase()}) ${cleanDefinition(parts[1])}`;
                                } else {
                                    def = cleanDefinition(rawDef);
                                }
                            }
                            return { valid: true, def: def };
                        }
                    }
                }
            } catch (e) {}
            return { valid: false, def: "" };
        }

        function calculateCurrentWordScore() {
            if (currentWordString.length < 3) return 0;
            let points = currentWordString.length * currentWordString.length * 25;
            selectedIndices.forEach(idx => {
                const tile = gridState[idx];
                if (tile) {
                    if (tile.bonus === 'green') points += 500;
                    if (tile.bonus === 'gold') points += 1000;
                    if (tile.bonus === 'flame') points += 300;
                }
            });
            if (currentWordString.toUpperCase() === currentBountyWord) {
                points += 3000;
            }
            return points;
        }

        function updateBountyLighting() {
            const upWord = currentWordString.toUpperCase();
            let matchCount = 0;
            for (let i = 0; i < upWord.length && i < currentBountyWord.length; i++) {
                if (upWord[i] === currentBountyWord[i]) {
                    matchCount++;
                } else {
                    break;
                }
            }
            const isComplete = (upWord === currentBountyWord);
            renderBountySlots(matchCount, isComplete);
        }

        async function updateCurrentWord() {
            currentWordString = selectedIndices.map(i => gridState[i].letter).join('');
            
            updateBountyLighting();

            isCurrentWordValid = false;
            validDefinitionText = "";

            if (apiDebounceTimer) {
                clearTimeout(apiDebounceTimer);
                apiDebounceTimer = null;
            }

            if (currentWordString.length >= 3) {
                const word = currentWordString.toUpperCase();

                if (onlineSessionCache[word] !== undefined) {
                    isCurrentWordValid = onlineSessionCache[word].valid;
                    validDefinitionText = onlineSessionCache[word].def;
                    
                    if (isCurrentWordValid) {
                        let livePoints = calculateCurrentWordScore();
                        wordEl.innerHTML = `${currentWordString} <span style="font-size: 0.85rem; color: var(--mustard); font-weight: 900; margin-left: 6px;">(+${livePoints.toLocaleString()})</span>`;
                    } else {
                        wordEl.textContent = currentWordString;
                    }
                    
                    updateButtonStates();
                    renderGridInitial();
                    return;
                }

                if (OVERRIDE_WORDS.has(word)) {
                    let def = `Valid colloquial/slang term (${word.length} letters).`;
                    onlineSessionCache[word] = { valid: true, def: def };
                    isCurrentWordValid = true;
                    validDefinitionText = def;

                    let livePoints = calculateCurrentWordScore();
                    wordEl.innerHTML = `${currentWordString} <span style="font-size: 0.85rem; color: var(--mustard); font-weight: 900; margin-left: 6px;">(+${livePoints.toLocaleString()})</span>`;

                    updateButtonStates();
                    renderGridInitial();
                    return;
                }

                let isInCategoryLocally = false;
                for (let cat in WORD_CATEGORIES) {
                    if (WORD_CATEGORIES[cat].includes(word)) {
                        isInCategoryLocally = true;
                        break;
                    }
                }
                if (isInCategoryLocally) {
                    let def = `Category word (${word.length} letters).`;
                    onlineSessionCache[word] = { valid: true, def: def };
                    isCurrentWordValid = true;
                    validDefinitionText = def;

                    let livePoints = calculateCurrentWordScore();
                    wordEl.innerHTML = `${currentWordString} <span style="font-size: 0.85rem; color: var(--mustard); font-weight: 900; margin-left: 6px;">(+${livePoints.toLocaleString()})</span>`;

                    updateButtonStates();
                    renderGridInitial();
                    return;
                }

                apiDebounceTimer = setTimeout(async () => {
                    if (currentWordString.toUpperCase() !== word) return;

                    let exactCheck = await checkApiWord(word);
                    if (exactCheck.valid && currentWordString.toUpperCase() === word) {
                        onlineSessionCache[word] = exactCheck;
                        isCurrentWordValid = true;
                        validDefinitionText = exactCheck.def;

                        let livePoints = calculateCurrentWordScore();
                        wordEl.innerHTML = `${currentWordString} <span style="font-size: 0.85rem; color: var(--mustard); font-weight: 900; margin-left: 6px;">(+${livePoints.toLocaleString()})</span>`;

                        updateButtonStates();
                        renderGridInitial();
                        return;
                    }

                    let baseCandidates = [];
                    if (word.endsWith('S') && word.length > 3) {
                        if (word.endsWith('ES') && word.length > 4) {
                            baseCandidates.push(word.slice(0, -2));
                        }
                        baseCandidates.push(word.slice(0, -1));
                    }
                    if (word.endsWith('ING') && word.length > 4) {
                        let stem = word.slice(0, -3);
                        baseCandidates.push(stem);
                        baseCandidates.push(stem + 'E');
                        if (stem.length > 1 && stem[stem.length - 1] === stem[stem.length - 2]) {
                            baseCandidates.push(stem.slice(0, -1));
                        }
                    }
                    if (word.endsWith('ER') && word.length > 3) {
                        let stem = word.slice(0, -2);
                        baseCandidates.push(stem);
                        baseCandidates.push(stem + 'E');
                        if (stem.length > 1 && stem[stem.length - 1] === stem[stem.length - 2]) {
                            baseCandidates.push(stem.slice(0, -1));
                        }
                    }

                    for (let candidate of baseCandidates) {
                        if (candidate.length >= 2) {
                            let candidateCheck = await checkApiWord(candidate);
                            if (candidateCheck.valid && currentWordString.toUpperCase() === word) {
                                let def = candidateCheck.def;
                                onlineSessionCache[word] = { valid: true, def: def };
                                isCurrentWordValid = true;
                                validDefinitionText = def;

                                let livePoints = calculateCurrentWordScore();
                                wordEl.innerHTML = `${currentWordString} <span style="font-size: 0.85rem; color: var(--mustard); font-weight: 900; margin-left: 6px;">(+${livePoints.toLocaleString()})</span>`;

                                updateButtonStates();
                                renderGridInitial();
                                return;
                            }
                        }
                    }

                    onlineSessionCache[word] = { valid: false, def: "" };
                    updateButtonStates();
                    renderGridInitial();
                }, 250);
            }
            
            if (isCurrentWordValid) {
                let livePoints = calculateCurrentWordScore();
                wordEl.innerHTML = `${currentWordString} <span style="font-size: 0.85rem; color: var(--mustard); font-weight: 900; margin-left: 6px;">(+${livePoints.toLocaleString()})</span>`;
            } else {
                wordEl.textContent = currentWordString;
            }

            updateButtonStates();
            renderGridInitial();
        }

        function clearSelection() {
            if (apiDebounceTimer) {
                clearTimeout(apiDebounceTimer);
                apiDebounceTimer = null;
            }
            selectedIndices = [];
            isCurrentWordValid = false;
            currentWordString = "";
            wordEl.textContent = "";
            renderBountySlots(0);
            playSound('tap');
            triggerHaptic(15);
            renderGridInitial();
        }

        function spawnFloatingScore(points) {
            const particle = document.createElement('div');
            particle.className = 'score-particle';
            particle.textContent = `+${points}`;
            particle.style.left = `calc(50% - 25px)`;
            particle.style.top = `42%`;
            
            document.getElementById('game-area').appendChild(particle);
            setTimeout(() => particle.remove(), 850);
        }

        function animateScoreChange(startScore, endScore, duration = 500) {
            const startTime = performance.now();
            function updateCount(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easeProgress = 1 - Math.pow(1 - progress, 3);
                const currentDisplayScore = Math.round(startScore + (endScore - startScore) * easeProgress);
                
                scoreEl.textContent = currentDisplayScore.toLocaleString();
                
                if (progress < 1) {
                    requestAnimationFrame(updateCount);
                }
            }
            requestAnimationFrame(updateCount);
        }

        async function advanceFlamingHazards(usedFlameIndices) {
            let gameOverTriggered = false;
            let movesToAdvance = [];

            for (let row = 0; row < GRID_SIZE; row++) {
                for (let col = 0; col < GRID_SIZE; col++) {
                    let idx = row * GRID_SIZE + col;
                    let tile = gridState[idx];

                    if (tile && tile.bonus === 'flame' && !usedFlameIndices.includes(idx)) {
                        if (row === GRID_SIZE - 1) {
                            gameOverTriggered = true;
                        } else {
                            let nextRow = row + 1;
                            let possibleCols = [];
                            if (row % 2 === 0) {
                                possibleCols = [col, col - 1];
                            } else {
                                possibleCols = [col, col + 1];
                            }

                            let targetCol = col;
                            for (let c of possibleCols) {
                                if (c >= 0 && c < GRID_SIZE) {
                                    let candidateIdx = nextRow * GRID_SIZE + c;
                                    if (gridState[candidateIdx] !== null) {
                                        targetCol = c;
                                        break;
                                    }
                                }
                            }

                            let targetIdx = nextRow * GRID_SIZE + targetCol;
                            
                            if (gridState[targetIdx] !== null) {
                                movesToAdvance.push({ fromIdx: idx, targetIdx: targetIdx, tileObj: tile });
                            }
                        }
                    }
                }
            }

            if (movesToAdvance.length > 0 && !gameOverTriggered) {
                playSound('burn');
                triggerHaptic(60);

                let eatenTileIds = new Set();
                movesToAdvance.forEach(m => {
                    if (gridState[m.targetIdx]) {
                        eatenTileIds.add(gridState[m.targetIdx].id);
                    }
                });

                movesToAdvance.forEach(m => {
                    gridState[m.targetIdx] = m.tileObj;
                    gridState[m.fromIdx] = { id: nextTileId++, letter: getRandomLetter(), isNewSpawn: true };
                });

                await renderGridFLIP('0.85s', eatenTileIds);
            }

            return gameOverTriggered;
        }

        async function submitWord() {
            if (isAnimating) return;

            if (!isCurrentWordValid) {
                setMascot(`Words must be at least 3 letters long and valid!`, "error");
                return;
            }

            const word = currentWordString.toUpperCase();
            const isBountyHit = (word === currentBountyWord);

            if (isBountyHit) {
                playSound('bounty');
                triggerHaptic([75, 50, 75]);
            } else {
                playSound('submit');
                triggerHaptic(45);
            }

            isAnimating = true;
            const definitionText = validDefinitionText || "A word.";
            const savedIndices = [...selectedIndices];

            let foundCategory = null;
            let isNewDiscovery = false;

            for (let cat in WORD_CATEGORIES) {
                if (WORD_CATEGORIES[cat].includes(word)) {
                    foundCategory = cat;
                    if (!discoveredWords[cat]) discoveredWords[cat] = [];
                    if (!discoveredWords[cat].includes(word)) {
                        discoveredWords[cat].push(word);
                        localStorage.setItem('bookley_discovered', JSON.stringify(discoveredWords));
                        isNewDiscovery = true;
                    }
                    break;
                }
            }

            let basePoints = word.length * word.length * 25;
            let bonusPoints = 0;

            savedIndices.forEach(idx => {
                const tile = gridState[idx];
                if (tile.bonus === 'green') bonusPoints += 500;
                if (tile.bonus === 'gold') bonusPoints += 1000;
                if (tile.bonus === 'flame') {
                    bonusPoints += 300;
                }
            });

            let totalPointsEarned = basePoints + bonusPoints;
            if (isBountyHit) {
                totalPointsEarned += 3000;
            }

            let oldScore = score;
            score += totalPointsEarned;
            animateScoreChange(oldScore, score, 500);
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('bookley_high_score', highScore);
                highScoreEl.textContent = highScore.toLocaleString();
            }

            spawnFloatingScore(totalPointsEarned);

            let bonusTileTypeToSpawn = null;
            if (word.length >= 7) bonusTileTypeToSpawn = 'gold';
            else if (word.length >= 5) bonusTileTypeToSpawn = 'green';

            renderGridInitial();
            await new Promise(r => setTimeout(r, 200));

            savedIndices.forEach(i => {
                gridState[i] = null;
            });

            let bonusInjected = false;

            for (let col = 0; col < GRID_SIZE; col++) {
                let columnTiles = [];
                for (let row = GRID_SIZE - 1; row >= 0; row--) {
                    let idx = row * GRID_SIZE + col;
                    if (gridState[idx] !== null) {
                        columnTiles.push(gridState[idx]);
                    }
                }

                for (let row = GRID_SIZE - 1; row >= 0; row--) {
                    let idx = row * GRID_SIZE + col;
                    if (columnTiles.length > 0) {
                        gridState[idx] = columnTiles.shift();
                        gridState[idx].isNewSpawn = false;
                    } else {
                        let bType = null;
                        if (bonusTileTypeToSpawn && !bonusInjected) {
                            bType = bonusTileTypeToSpawn;
                            bonusInjected = true;
                        } else if (Math.random() < redTileSpawnChance) {
                            bType = 'flame';
                        }
                        gridState[idx] = { id: nextTileId++, letter: getRandomLetter(), bonus: bType, isNewSpawn: true };
                    }
                }
            }

            selectedIndices = [];
            isCurrentWordValid = false;
            currentWordString = "";
            wordEl.textContent = "";
            renderBountySlots(0);

            await renderGridFLIP('0.38s');

            const isGameOver = await advanceFlamingHazards(savedIndices);

            if (isGameOver) {
                triggerGameOver("A flaming red letter reached the bottom and burned through your board!");
                return;
            }

            let speechNote = `"${word}": ${definitionText}`;
            if (isBountyHit) {
                speechNote = `🎯 BOUNTY FOUND! "${word}" cleared for +3,000 bonus points! 🎉`;
                pickNewBountyWord();
            }

            if (foundCategory) {
                speechNote += ` 🏆 (${foundCategory})`;
                if (isNewDiscovery) {
                    setTimeout(() => {
                        openCollectionModal(foundCategory, word);
                    }, 400);
                }
            }

            setMascot(speechNote, "neutral");

            const praiseBubble = document.getElementById('praise-bubble');
            if ((word.length >= 6 || isBountyHit) && praiseBubble) {
                const praises = isBountyHit ? ["Bounty!", "Jackpot!", "Amazing!"] : ["Nice!", "Well done!", "Good work!"];
                praiseBubble.textContent = praises[Math.floor(Math.random() * praises.length)];
                praiseBubble.classList.add('active');
                setTimeout(() => {
                    praiseBubble.classList.remove('active');
                }, 2000);
            }

            setTimeout(() => {
                checkLevelProgress();
            }, 2600);

            setTimeout(() => {
                isAnimating = false;
            }, 200);
        }

        function openThemeModal() {
            const container = document.getElementById('theme-list-container');
            container.innerHTML = '';

            THEMES.forEach(t => {
                const item = document.createElement('div');
                item.className = `theme-item ${t.id === currentTheme ? 'active-theme' : ''}`;
                item.innerHTML = `
                    <span>${t.name}</span>
                    <div class="theme-preview-dots">
                        <div class="theme-dot" style="background: ${t.bg};"></div>
                        <div class="theme-dot" style="background: ${t.primary};"></div>
                        <div class="theme-dot" style="background: ${t.tile};"></div>
                    </div>
                `;
                item.onclick = () => {
                    setTheme(t.id);
                    openThemeModal();
                };
                container.appendChild(item);
            });

            const modal = document.getElementById('theme-modal');
            modal.classList.add('active');
            modal.onclick = (e) => {
                if (e.target === modal) closeThemeModal();
            };
        }

        function closeThemeModal() {
            document.getElementById('theme-modal').classList.remove('active');
        }

        function setTheme(themeId) {
            currentTheme = themeId;
            document.body.setAttribute('data-theme', themeId);
            localStorage.setItem('bookley_theme', themeId);
            initAmbientDust();
            setMascot(`Switched to ${THEMES.find(t => t.id === themeId)?.name || themeId} theme! ✨`, "neutral");
        }

        function openCollectionModal(highlightCategory = null, highlightWord = null) {
            const container = document.getElementById('category-list-container');
            container.innerHTML = '';
            let totalDiscovered = 0;
            let targetGroupEl = null;

            for (let cat in WORD_CATEGORIES) {
                const words = WORD_CATEGORIES[cat];
                const found = discoveredWords[cat] || [];
                totalDiscovered += found.length;

                let tier34Done = words.slice(0, 12).every(w => found.includes(w));
                let tier5Done = words.slice(12, 17).every(w => found.includes(w));
                let tier67Done = words.slice(17, 20).every(w => found.includes(w));

                let tierClass = "";
                if (tier67Done) tierClass = "tier-gold";
                else if (tier5Done) tierClass = "tier-silver";
                else if (tier34Done) tierClass = "tier-blue";

                const group = document.createElement('div');
                group.className = 'category-group collapsed';
                if (cat === highlightCategory) {
                    group.classList.remove('collapsed');
                    targetGroupEl = group;
                }

                const header = document.createElement('div');
                header.className = `category-header ${tierClass}`;
                header.innerHTML = `<span>${cat}</span><span>${found.length} / ${words.length} ▾</span>`;

                const wordsContainer = document.createElement('div');
                wordsContainer.className = 'category-words';

                words.forEach((w, idx) => {
                    const badge = document.createElement('span');
                    badge.className = 'word-badge';
                    
                    let wordTierColorClass = "discovered";
                    if (found.includes(w)) {
                        if (idx < 12) wordTierColorClass = "tier-blue-word";
                        else if (idx < 17) wordTierColorClass = "tier-silver-word";
                        else wordTierColorClass = "tier-gold-word";
                        badge.classList.add(wordTierColorClass);
                    }

                    if (cat === highlightCategory && w === highlightWord) {
                        badge.classList.add('reveal-anim', wordTierColorClass);
                    }

                    badge.textContent = w;
                    wordsContainer.appendChild(badge);
                });

                group.onclick = () => {
                    group.classList.toggle('collapsed');
                };

                group.appendChild(header);
                group.appendChild(wordsContainer);
                container.appendChild(group);
            }

            document.getElementById('collection-count').textContent = totalDiscovered;
            const modal = document.getElementById('collection-modal');
            modal.classList.add('active');

            modal.onclick = (e) => {
                if (e.target === modal) {
                    closeCollectionModal();
                }
            };

            if (targetGroupEl) {
                setTimeout(() => {
                    targetGroupEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }, 150);
            }
        }

        function closeCollectionModal() {
            document.getElementById('collection-modal').classList.remove('active');
        }

        function checkLevelProgress() {
            if (score >= targetScore) {
                level++;
                targetScore += Math.round(5000 * Math.pow(1.6, level - 1));
                redTileSpawnChance = Math.min(0.50, redTileSpawnChance + 0.02);

                levelEl.textContent = level;
                targetEl.textContent = targetScore.toLocaleString();
                playSound('levelup');
                setMascot(`Level ${level} achieved! Red tile spawn rate is now ${Math.round(redTileSpawnChance * 100)}%! 🎉`, "neutral");
            }
        }

        function triggerGameOver(reason) {
            playSound('gameover');
            triggerHaptic([100, 50, 100]);
            document.getElementById('game-over-text').textContent = reason;
            document.getElementById('game-over-modal').classList.add('active');
            setMascot("Oh no! The fire reached the bottom! Game over! 😿", "neutral");
        }

        function resetGame() {
            document.getElementById('game-over-modal').classList.remove('active');
            score = 0;
            level = 1;
            targetScore = 5000;
            shufflePenaltyCount = 0;
            redTileSpawnChance = 0.08;
            scoreEl.textContent = "0";
            levelEl.textContent = "1";
            targetEl.textContent = "5,000";
            isAnimating = false;
            clearSelection();
            initGrid();
            setMascot("Fresh start! Keep an eye on those flaming letters! 🔥", "neutral");
        }

        function setMascot(text, expression) {
            speechEl.textContent = text;
            renderMascot(expression);
        }

        renderMascot('neutral');
        initAmbientDust();
        initGrid();
    </script>
</body>
</html>
